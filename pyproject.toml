[project]
name = "hummingbirdrec"
version = "0.1.0"
description = ""
authors = [
    {name = "Mia",email = "miaomiao9721@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pandas = "^2.2.0"
matplotlib = "^3.10.1"
torch = { version = "2.6.0+cu124", source = "torch-cu124"}
generative-recommenders = { path = "./generative-recommenders", develop = true, extras = [] }
fbgemm_gpu = ">=1.1.0,<1.2.0"
torchrec = ">=1.1.0,<1.2.0"
gin_config = ">=0.5.0,<0.6.0"
tensorboard = "2.19.0"
pybind11 = "2.11.1"
scipy = "^1.15.3"

[[tool.poetry.source]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
